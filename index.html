<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IASA 익명 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .post-card { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .active-tab { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- [1] 로그인/회원가입 섹션 (실명 및 iasa.icehs.kr 인증) -->
    <div id="authContainer" class="fixed inset-0 z-[200] bg-indigo-950 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <!-- 로그인 박스 -->
            <div id="loginBox">
                <h2 class="text-2xl font-bold text-indigo-600 mb-2 text-center tracking-tighter">IASA 익명 게시판</h2>
                <p class="text-xs text-gray-400 text-center mb-8">학교 이메일(@iasa.icehs.kr)로 로그인하세요.</p>
                <input id="loginEmail" type="email" placeholder="학교 이메일 (@iasa.icehs.kr)" class="w-full p-4 bg-gray-50 rounded-2xl mb-3 outline-none focus:ring-2 focus:ring-indigo-500 border-none">
                <input id="loginPw" type="password" placeholder="비밀번호" class="w-full p-4 bg-gray-50 rounded-2xl mb-6 outline-none focus:ring-2 focus:ring-indigo-500 border-none">
                <button onclick="auth.login()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition mb-4 shadow-lg">로그인</button>
                <p class="text-xs text-center text-gray-400">처음 오셨나요? <button onclick="auth.toggle()" class="text-indigo-600 font-bold underline ml-1">회원가입</button></p>
            </div>
            <!-- 회원가입 박스 -->
            <div id="signupBox" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center text-lg">학생 회원가입</h2>
                <p class="text-[10px] text-gray-400 text-center mb-6">부적절한 게시글 작성을 방지하기 위해 실명을 수집합니다.</p>
                <input id="signName" type="text" placeholder="본명 (실명)" class="w-full p-4 bg-gray-50 rounded-2xl mb-2 outline-none border-none">
                <input id="signEmail" type="email" placeholder="학교 이메일 (@iasa.icehs.kr)" class="w-full p-4 bg-gray-50 rounded-2xl mb-2 outline-none border-none">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input id="signId" type="text" placeholder="학번 (예: 10101)" class="p-4 bg-gray-50 rounded-2xl outline-none border-none">
                    <select id="signGrade" class="p-4 bg-gray-50 rounded-2xl outline-none font-bold text-gray-500 border-none">
                        <option value="9기">9기</option><option value="10기">10기</option><option value="11기">11기</option>
                    </select>
                </div>
                <input id="signPw" type="password" placeholder="비밀번호 설정" class="w-full p-4 bg-gray-50 rounded-2xl mb-6 outline-none border-none">
                <button onclick="auth.signup()" class="w-full py-4 bg-green-600 text-white rounded-2xl font-bold hover:bg-green-700 transition shadow-lg">가입 및 본인인증</button>
                <button onclick="auth.toggle()" class="w-full mt-4 text-xs text-gray-400 font-bold underline text-center">로그인으로 돌아가기</button>
            </div>
        </div>
    </div>

    <!-- [2] 네비게이션 & 검색 -->
    <nav class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-50 px-4">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center py-4 gap-4">
            <h1 onclick="location.reload()" class="text-xl font-black text-indigo-600 cursor-pointer tracking-tighter">IASA <span class="font-light text-gray-400">익명 게시판</span></h1>
            
            <div class="relative w-full max-w-sm">
                <input id="searchInput" type="text" onkeyup="app.search()" placeholder="글 제목 검색..." class="w-full pl-10 pr-4 py-2 bg-gray-100 rounded-full text-sm outline-none focus:ring-2 focus:ring-indigo-400 transition-all border-none">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
            </div>

            <div class="flex items-center gap-3">
                <span id="userProfile" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full"></span>
                <button onclick="app.openModal('write')" class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-lg hover:bg-indigo-700">글쓰기</button>
            </div>
        </div>
    </nav>

    <!-- [3] 카테고리/기수 필터 -->
    <div class="bg-white border-b sticky top-[125px] md:top-[73px] z-40">
        <div class="container mx-auto px-4 text-center">
            <div id="tabBar" class="flex justify-center space-x-6 overflow-x-auto no-scrollbar py-2 text-sm text-gray-500 border-b border-gray-50">
                <button onclick="app.setFilter('전체')" class="category-tab active-tab pb-1 whitespace-nowrap">전체주제</button>
                <button onclick="app.setFilter('학업')" class="category-tab pb-1 whitespace-nowrap">📚 학업</button>
                <button onclick="app.setFilter('생활')" class="category-tab pb-1 whitespace-nowrap">🏠 생활</button>
                <button onclick="app.setFilter('시설')" class="category-tab pb-1 whitespace-nowrap">🏫 시설</button>
                <button onclick="app.setFilter('기타')" class="category-tab pb-1 whitespace-nowrap">💬 기타</button>
            </div>
            <div id="gradeTabBar" class="flex justify-center space-x-6 overflow-x-auto no-scrollbar py-2 text-xs text-gray-400">
                <button onclick="app.setGradeFilter('전체')" class="grade-tab active-tab pb-1 whitespace-nowrap">전체기수</button>
                <button onclick="app.setGradeFilter('9기')" class="grade-tab pb-1 whitespace-nowrap">9기</button>
                <button onclick="app.setGradeFilter('10기')" class="grade-tab pb-1 whitespace-nowrap">10기</button>
                <button onclick="app.setGradeFilter('11기')" class="grade-tab pb-1 whitespace-nowrap">11기</button>
            </div>
        </div>
    </div>

    <!-- [4] 메인 콘텐츠 -->
    <main class="container mx-auto mt-6 px-4 max-w-2xl pb-24">
        <div id="postList" class="space-y-4"></div>
    </main>

    <!-- [5] 글쓰기 모달 -->
    <div id="writeModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">새로운 글 작성</h2>
                <button onclick="app.closeModal('write')" class="text-gray-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                    <select id="pGrade" class="p-3 bg-gray-50 rounded-2xl outline-none border-none">
                        <option value="9기">9기</option><option value="10기">10기</option><option value="11기">11기</option>
                    </select>
                    <select id="pCategory" class="p-3 bg-gray-50 rounded-2xl outline-none border-none">
                        <option value="학업">📚 학업</option><option value="생활">🏠 생활</option><option value="시설">🏫 시설</option><option value="기타">💬 기타</option>
                    </select>
                    <select id="pVisibility" class="p-3 bg-gray-50 rounded-2xl outline-none border-none">
                        <option value="public">🌍 전체공개</option><option value="private">🔒 비공개</option>
                    </select>
                </div>
                <input id="pTitle" type="text" placeholder="제목" class="w-full p-4 bg-gray-50 rounded-2xl outline-none border-none focus:ring-2 focus:ring-indigo-400">
                <textarea id="pContent" placeholder="여기에 내용을 입력하세요..." rows="6" class="w-full p-4 bg-gray-50 rounded-2xl outline-none border-none focus:ring-2 focus:ring-indigo-400"></textarea>
                
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border-none">
                    <label class="cursor-pointer bg-white px-3 py-2 rounded-xl text-[10px] font-bold shadow-sm">
                        <i class="fa-solid fa-paperclip mr-1 text-indigo-500"></i> 파일/이미지 첨부
                        <input type="file" id="pFile" class="hidden" accept=".jpg,.png,.pdf">
                    </label>
                    <span id="fileName" class="text-[10px] text-gray-400 truncate max-w-[150px]"></span>
                </div>

                <div class="p-4 bg-indigo-50 rounded-2xl">
                    <label class="block text-[10px] font-bold text-indigo-400 mb-1">삭제 비밀번호 (4자리)</label>
                    <input id="pPassword" type="password" maxlength="4" placeholder="숫자 입력" class="w-full bg-transparent outline-none text-sm font-bold border-none p-0 text-indigo-900">
                </div>

                <button id="submitBtn" onclick="app.submitPost()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition">게시글 등록</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Firebase 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyAEZfvqAOOI0n9zCScsXQvuYEC2n3Xvw7k",
            authDomain: "iasa-website-2a168.firebaseapp.com",
            projectId: "iasa-website-2a168",
            storageBucket: "iasa-website-2a168.firebasestorage.app",
            messagingSenderId: "769584122128",
            appId: "1:769584122128:web:45b71a6d103033d254fd95"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 닉네임 조합 및 금지어
        const adjs = ["빛나는", "차분한", "치밀한", "용감한", "슬기로운", "창의적인", "열정적인", "날카로운", "빠른", "고요한", "냉철한"];
        const nouns = ["뉴턴", "아인슈타인", "퀴리", "테슬라", "가우스", "입자", "양자", "원소", "프랙탈", "은하", "피펫", "전자"];
        const banned = ["욕설", "나쁜말", "선정단어"];

        // --- 2. 인증 로직 (iasa.icehs.kr 전용) ---
        const auth = {
            toggle() {
                document.getElementById('loginBox').classList.toggle('hidden');
                document.getElementById('signupBox').classList.toggle('hidden');
            },
            async signup() {
                const name = document.getElementById('signName').value.trim();
                const email = document.getElementById('signEmail').value.trim();
                const sid = document.getElementById('signId').value.trim();
                const grade = document.getElementById('signGrade').value;
                const pw = document.getElementById('signPw').value.trim();

                if(!name || !email || !sid || !pw) return alert("모든 항목을 입력하세요.");
                if(!email.endsWith("@iasa.icehs.kr")) return alert("학교 이메일(@iasa.icehs.kr)만 가입 가능합니다.");

                const check = await db.collection("users").doc(email).get();
                if(check.exists) return alert("이미 가입된 계정입니다.");

                await db.collection("users").doc(email).set({ realName: name, studentId: sid, grade, pw });
                alert("회원가입 완료! 로그인 해주세요.");
                this.toggle();
            },
            async login() {
                const email = document.getElementById('loginEmail').value.trim();
                const pw = document.getElementById('loginPw').value.trim();
                const userDoc = await db.collection("users").doc(email).get();

                if(userDoc.exists && userDoc.data().pw === pw) {
                    const data = userDoc.data();
                    const nick = adjs[Math.floor(Math.random()*adjs.length)] + " " + nouns[Math.floor(Math.random()*nouns.length)];
                    const userData = { email, name: data.realName, grade: data.grade, nick };
                    sessionStorage.setItem('iasa_user', JSON.stringify(userData));
                    location.reload();
                } else {
                    alert("이메일 또는 비밀번호가 틀립니다.");
                }
            }
        };

        // --- 3. 게시판 앱 로직 ---
        const app = {
            user: JSON.parse(sessionStorage.getItem('iasa_user')),
            posts: [],
            filter: '전체',
            gradeFilter: '전체',

            init() {
                if(this.user) {
                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('userProfile').innerText = `${this.user.grade} | ${this.user.nick}`;
                    this.load();
                }
                document.getElementById('pFile').onchange = (e) => {
                    document.getElementById('fileName').innerText = e.target.files[0]?.name || "";
                };
            },

            load() {
                db.collection("posts").orderBy("createdAt", "desc").onSnapshot(s => {
                    this.posts = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
            },

            setFilter(f) {
                this.filter = f;
                document.querySelectorAll('.category-tab').forEach(t => t.classList.toggle('active-tab', t.innerText.includes(f)));
                this.render();
            },

            setGradeFilter(g) {
                this.gradeFilter = g;
                document.querySelectorAll('.grade-tab').forEach(t => t.classList.toggle('active-tab', t.innerText.includes(g)));
                this.render();
            },

            search() { this.render(); },

            async submitPost() {
                const title = document.getElementById('pTitle').value.trim();
                const content = document.getElementById('pContent').value.trim();
                const category = document.getElementById('pCategory').value;
                const grade = document.getElementById('pGrade').value;
                const visibility = document.getElementById('pVisibility').value;
                const pw = document.getElementById('pPassword').value;

                if(!title || !content || pw.length < 4) return alert("빈칸을 채우고 비밀번호 4자리를 설정하세요.");
                if(banned.some(w => title.includes(w) || content.includes(w))) return alert("부적절한 내용이 감지되었습니다.");

                const btn = document.getElementById('submitBtn');
                btn.disabled = true; btn.innerText = "게시 중...";

                await db.collection("posts").add({
                    title, content, category, grade, visibility, pw,
                    authorEmail: this.user.email, // 관리자 확인용 추적 데이터
                    authorNick: this.user.nick,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    date: new Date().toLocaleDateString(),
                    votes: 0,
                    comments: []
                });

                this.closeModal('write');
                btn.disabled = false; btn.innerText = "게시하기";
            },

            async upvote(id) {
                await db.collection("posts").doc(id).update({ votes: firebase.firestore.FieldValue.increment(1) });
            },

            async deletePost(id, correctPw) {
                const pw = prompt("비밀번호 4자리를 입력하세요.");
                if(pw === correctPw) await db.collection("posts").doc(id).delete();
                else alert("비밀번호 불일치");
            },

            async addComment(id) {
                const input = document.getElementById(`comment-${id}`);
                if(!input.value.trim()) return;
                const post = this.posts.find(p => p.id === id);
                const newComments = [...(post.comments || []), { author: this.user.nick, text: input.value }];
                await db.collection("posts").doc(id).update({ comments: newComments });
                input.value = '';
            },

            openModal(id) { document.getElementById(`${id}Modal`).classList.remove('hidden'); },
            closeModal(id) { document.getElementById(`${id}Modal`).classList.add('hidden'); },

            render() {
                const container = document.getElementById('postList');
                const searchQuery = document.getElementById('searchInput').value.toLowerCase();
                container.innerHTML = '';

                const filtered = this.posts.filter(p => {
                    const catMatch = this.filter === '전체' || p.category === this.filter;
                    const gradeMatch = this.gradeFilter === '전체' || p.grade === this.gradeFilter;
                    const searchMatch = p.title.toLowerCase().includes(searchQuery);
                    const visMatch = p.visibility === 'public' || p.authorEmail === this.user.email;
                    return catMatch && gradeMatch && searchMatch && visMatch;
                });

                if(filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-20 text-gray-300 font-bold bg-white rounded-[2rem] border border-dashed">글이 없습니다.</div>`;
                    return;
                }

                filtered.forEach(post => {
                    const card = document.createElement('div');
                    card.className = `post-card p-6 rounded-[2rem] shadow-sm border mb-4 ${post.visibility === 'private' ? 'bg-indigo-50 border-indigo-100' : 'bg-white border-gray-100'}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex gap-2 text-[10px] font-bold">
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-600 rounded-full">${post.grade}</span>
                                <span class="px-3 py-1 bg-gray-100 text-gray-500 rounded-full">${post.category}</span>
                            </div>
                            <div class="text-[10px] text-gray-400 font-medium">
                                <span>${post.date}</span>
                                ${post.authorEmail === this.user.email ? `<button onclick="app.deletePost('${post.id}', '${post.pw}')" class="text-red-400 ml-2">삭제</button>` : ''}
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">${post.title}</h3>
                        <p class="text-sm text-gray-600 mb-6 leading-relaxed whitespace-pre-wrap">${post.content}</p>
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="app.upvote('${post.id}')" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white rounded-2xl text-xs font-bold shadow-lg hover:scale-105 transition">
                                <i class="fa-solid fa-thumbs-up"></i> 동의 ${post.votes || 0}
                            </button>
                            <span class="text-[10px] text-gray-400">By ${post.authorNick}</span>
                        </div>
                        <div class="border-t border-gray-50 pt-4 mt-4">
                            <div class="space-y-2 mb-4">
                                ${(post.comments || []).map(c => `<div class="text-[11px] bg-gray-50 p-3 rounded-2xl"><span class="font-bold text-indigo-500">${c.author}</span> <span class="text-gray-600 ml-1">${c.text}</span></div>`).join('')}
                            </div>
                            <div class="flex gap-2">
                                <input id="comment-${post.id}" type="text" placeholder="댓글..." class="flex-1 text-xs p-3 bg-gray-50 rounded-2xl outline-none focus:ring-1 focus:ring-indigo-200 border-none">
                                <button onclick="app.addComment('${post.id}')" class="text-xs font-bold text-indigo-600 px-4">등록</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        };

        app.init();
    </script>
</body>
</html>
